; GAMMA OptiBridge MT Action20 flora stability alpha
; Place this file beside AnomalyDX11.exe / AnomalyDX11AVX.exe.
;
; NativeSceneScale=0 preserves the validated MT baseline.
; NativeSceneScale=1 enables the Action17 true low-resolution scene path.
; ProjectionJitter=1 enables the Action18 global projection-jitter path.
; Action19 exposes temporal diagnostic controls.
; Action20 can synthesize a flora-only reactive/current-color-bias mask from
; X-Ray's packed G-buffer material ID (GAMMA MAT_FLORA = 0.47451).

[OptiBridge]
Enabled=1
Jitter=1
RenderScale=0.666667
NativeSceneScale=0
ProjectionJitter=1

; Multiplies the Halton jitter applied to the scene and the default jitter
; reported to the temporal upscaler. 1.0 preserves the standard FSR2 sample span.
JitterScale=1.0

; Additional multiplier only for the jitter metadata sent to FSR2/OptiScaler.
DispatchJitterScale=1.0

; Multiplies OptiBridge's SSFX motion-vector conversion.
;  1.0 = normal conversion
;  0.0 = zero effective motion vectors (diagnostic)
; -1.0 = flip the assumed direction (diagnostic)
MotionVectorScaleFactor=1.0

; 1 = tell FSR2/OptiScaler/DLSS that supplied MVs contain projection jitter.
MVJitterCancellation=1

; Action20 safe default OFF. When enabled, OptiBridge identifies flora from
; rt_Position.w, dilates the mask by one source pixel around silhouettes, and
; passes it as the temporal reactive/current-color-bias input.
FloraReactiveMask=0

; 0.0..1.0 current-frame bias strength for detected flora.
FloraReactiveStrength=1.0
