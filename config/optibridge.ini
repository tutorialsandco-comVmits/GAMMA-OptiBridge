; GAMMA OptiBridge scaled-input alpha
; Place this file beside AnomalyDX11.exe / AnomalyDX11AVX.exe.
; Stage 2 validates DLSS/FSR2 at a lower temporal input resolution while the
; engine still renders its normal scene targets at native resolution.
; This is a quality/correctness test first, not the final performance build.

[OptiBridge]
Enabled=1

; Temporal camera jitter required by FSR2/DLSS. Leave at 1 for normal testing.
; Set to 0 only as a diagnostic: if wobble remains with Jitter=0, the cause is
; outside the camera-jitter path (for example motion vectors/reconstruction).
Jitter=1

; 0.666667 = approximately DLSS Quality input size.
; At 2560x1080 this becomes about 1707x720 -> 2560x1080.
RenderScale=0.666667
