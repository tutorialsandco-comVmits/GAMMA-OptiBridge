; GAMMA OptiBridge MT Action24 alpha-only flora mip bias alpha
; Place this file beside AnomalyDX11.exe / AnomalyDX11AVX.exe.
;
; NativeSceneScale=0 preserves the validated MT baseline.
; NativeSceneScale=1 enables the Action17 true low-resolution scene path.
; ProjectionJitter=1 enables the Action18 global projection-jitter path.
; Action19 exposes temporal diagnostic controls.
; Action20 synthesizes a flora-only reactive/current-color-bias mask from
; X-Ray's packed G-buffer material ID (GAMMA MAT_FLORA = 0.47451).
; Action21 makes the source-pixel dilation radius configurable.
; Action22 stabilizes dedicated tree-branch alpha tests during shader compile.
; Action23 experimental hashed coverage remains available but is release-off.
; Action24 adds an alpha-test-only positive mip bias for tree-branch cutouts,
; leaving normal RGB/detail/bump sampling on the game's regular sampler state.

[OptiBridge]
Enabled=1
Jitter=1
RenderScale=0.666667
NativeSceneScale=0
ProjectionJitter=1

JitterScale=1.0
DispatchJitterScale=1.0
MotionVectorScaleFactor=1.0
MVJitterCancellation=1

FloraReactiveMask=0
FloraReactiveStrength=1.0
FloraReactiveRadius=1

FloraAlphaStabilization=0
FloraAlphaWidthScale=0.10

; Action24 safe repository default. 0.0 disables alpha-only mip bias.
; The first in-game test value will be +0.25, based on the successful global
; r__tf_mipbias +0.25 diagnostic at RenderScale=0.90.
FloraAlphaMipBias=0.0

; Action23 remains experimental and release-off after bright-weather testing.
FloraHashedCoverage=0
FloraHashedCoverageScale=0.05
