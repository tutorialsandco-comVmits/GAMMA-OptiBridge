; GAMMA OptiBridge MT Action19 temporal diagnostics
; Place this file beside AnomalyDX11.exe / AnomalyDX11AVX.exe.
;
; NativeSceneScale=0 preserves the validated MT Action15+Action16 baseline.
; NativeSceneScale=1 enables the Action17 true low-resolution scene path.
; ProjectionJitter=1 enables the Action18 global projection-jitter path.
;
; Action19 adds independent diagnostic controls for the temporal inputs so the
; shimmer can be isolated without rebuilding after every hypothesis.

[OptiBridge]
Enabled=1
Jitter=1
RenderScale=0.666667
NativeSceneScale=0
ProjectionJitter=1

; Multiplies the Halton jitter applied to the scene AND the default jitter
; reported to the temporal upscaler. 1.0 preserves Action18 exactly.
JitterScale=1.0

; Additional multiplier only for the jitter metadata sent to FSR2/OptiScaler.
; 1.0 means metadata matches the actual scene jitter.
DispatchJitterScale=1.0

; Multiplies OptiBridge's current SSFX motion-vector conversion.
;  1.0 = current Action17/18 conversion
;  0.0 = force zero effective motion vectors (stationary-scene diagnostic)
; -1.0 = flip the assumed motion-vector direction
MotionVectorScaleFactor=1.0

; 1 = tell FSR2/OptiScaler/DLSS that supplied MVs contain projection jitter.
; 0 = treat supplied MVs as jitter-free.
MVJitterCancellation=1
