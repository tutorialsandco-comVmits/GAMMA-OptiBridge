; GAMMA OptiBridge Action17 alpha
; Place this file beside AnomalyDX11.exe / AnomalyDX11AVX.exe.
;
; Legacy mode (NativeSceneScale=0) preserves the proven Action16 behavior:
; X-Ray renders native, OptiBridge prepares lower-resolution temporal inputs,
; and OptiScaler/DLSS reconstructs the native output.
;
; Action17 mode (NativeSceneScale=1) is the real-performance prototype:
; R4 scene/post targets render at RenderScale, OptiBridge temporally upscales,
; and X-Ray restores native dimensions for the final combine/presentation.

[OptiBridge]
Enabled=1

; FSR2/DLSS temporal camera jitter. Action15 established that this should be ON
; while FSR2 motion-vector jitter cancellation remains disabled in the runtime.
Jitter=1

; 0.666667 is approximately a DLSS Quality-style input ratio.
; At 2560x1080 this is about 1707x720 -> 2560x1080.
RenderScale=0.666667

; Action17 opt-in. Keep 0 for the Action16-compatible path.
; Set 1 only when testing the true low-resolution R4 scene path.
NativeSceneScale=0
