; GAMMA OptiBridge MT Action18 alpha
; Place this file beside AnomalyDX11.exe / AnomalyDX11AVX.exe.
;
; NativeSceneScale=0 preserves the validated MT Action15+Action16 baseline.
; NativeSceneScale=1 enables the Action17 true low-resolution scene path.
;
; Action18 fixes temporal-jitter coverage for NativeSceneScale=1 by applying
; FSR2 Halton jitter to X-Ray's actual scene projection instead of only the
; SSFX shaders that explicitly consume ssfx_jitter. The legacy SSFX XY jitter
; is suppressed while the projection path is active to avoid double jitter.

[OptiBridge]
Enabled=1

; Temporal jitter remains required for the final temporal solution.
Jitter=1

; Approximately DLSS Quality-style input ratio.
; At 2560x1080 this is about 1707x720 -> 2560x1080.
RenderScale=0.666667

; Opt-in only. Keep 0 for the validated MT baseline.
; Set 1 before launching GAMMA to test true low-resolution scene rendering.
NativeSceneScale=0

; Action18 A/B switch. Used only with NativeSceneScale=1 + Jitter=1.
; 1 = global projection-space jitter (new path)
; 0 = Action17's previous SSFX shader-constant jitter path
ProjectionJitter=1
