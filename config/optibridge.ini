; GAMMA OptiBridge MT Action22 flora alpha-stability alpha
; Place this file beside AnomalyDX11.exe / AnomalyDX11AVX.exe.
;
; NativeSceneScale=0 preserves the validated MT baseline.
; NativeSceneScale=1 enables the Action17 true low-resolution scene path.
; ProjectionJitter=1 enables the Action18 global projection-jitter path.
; Action19 exposes temporal diagnostic controls.
; Action20 synthesizes a flora-only reactive/current-color-bias mask from
; X-Ray's packed G-buffer material ID (GAMMA MAT_FLORA = 0.47451).
; Action21 makes the source-pixel dilation radius configurable.
; Action22 can stabilize dedicated tree-branch alpha tests during shader
; compilation without replacing the user's installed GAMMA/SSS shader files.

[OptiBridge]
Enabled=1
Jitter=1
RenderScale=0.666667
NativeSceneScale=0
ProjectionJitter=1

; Multiplies the Halton jitter applied to the scene and the default jitter
; reported to the temporal upscaler. 1.0 preserves the standard FSR2 sample span.
JitterScale=1.0

; Additional multiplier only for the jitter metadata sent to FSR2/OptiScaler.
DispatchJitterScale=1.0

; Multiplies OptiBridge's SSFX motion-vector conversion.
;  1.0 = normal conversion
;  0.0 = zero effective motion vectors (diagnostic)
; -1.0 = flip the assumed direction (diagnostic)
MotionVectorScaleFactor=1.0

; 1 = tell FSR2/OptiScaler/DLSS that supplied MVs contain projection jitter.
MVJitterCancellation=1

; Safe repository default OFF. When enabled, OptiBridge identifies flora from
; rt_Position.w and passes it as the temporal reactive/current-color-bias input.
FloraReactiveMask=0

; 0.0..1.0 current-frame bias strength for detected flora.
FloraReactiveStrength=1.0

; Source-pixel dilation around detected flora silhouettes.
; 0 = no dilation, 1 = Action20 behavior, 2..4 = wider coverage.
FloraReactiveRadius=1

; Action22 safe default OFF. When enabled, R4 patches only dedicated
; deffer_tree_branch_aref_* pixel-shader source before CRC/cache/compilation.
FloraAlphaStabilization=0

; 0.0..1.0 multiplier for derivative-width coverage expansion at tree alpha
; cutout edges. The first experimental value is 0.25.
FloraAlphaWidthScale=0.25
