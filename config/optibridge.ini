; GAMMA OptiBridge MT Action17 alpha
; Place this file beside AnomalyDX11.exe / AnomalyDX11AVX.exe.
;
; NativeSceneScale=0 preserves the validated MT Action15+Action16 baseline:
; X-Ray renders native, OptiBridge prepares lower-resolution temporal inputs,
; and OptiScaler/DLSS reconstructs the native output.
;
; NativeSceneScale=1 enables the Action17 real-performance prototype:
; R4 scene/post targets render at RenderScale, OptiBridge temporally upscales,
; and X-Ray restores native dimensions for final combine/presentation.

[OptiBridge]
Enabled=1

; Action15 validated this ON while FSR2 motion-vector jitter cancellation stays OFF.
Jitter=1

; Approximately DLSS Quality-style input ratio.
; At 2560x1080 this is about 1707x720 -> 2560x1080.
RenderScale=0.666667

; Opt-in only. Keep 0 for the validated MT baseline.
; Set 1 before launching GAMMA to test true low-resolution scene rendering.
NativeSceneScale=0
