; GAMMA OptiBridge v0.5.0-rc3 - validated Quality preset
; Target: 2560x1080 validation system, DX11 MT, OptiScaler -> DLSS.
; RC3 keeps RenderScale at 0.90 and uses alpha-only +0.25 foliage mip bias.

[OptiBridge]
Enabled=1
Jitter=1
RenderScale=0.90
NativeSceneScale=1
ProjectionJitter=1

; Validated temporal compromise.
JitterScale=0.35
DispatchJitterScale=1.0
MotionVectorScaleFactor=1.0
MVJitterCancellation=1

; Validated flora temporal inputs.
FloraReactiveMask=1
FloraReactiveStrength=0.50
FloraReactiveRadius=1

; Tree alpha stabilization.
FloraAlphaStabilization=1
FloraAlphaWidthScale=0.10

; Action24: only the foliage alpha cutout samples a softer mip.
; Global r__tf_mipbias should remain 0.
FloraAlphaMipBias=0.25

; Action23 hashed coverage is intentionally disabled.
FloraHashedCoverage=0
FloraHashedCoverageScale=0.05
