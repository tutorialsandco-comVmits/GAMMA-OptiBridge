; GAMMA OptiBridge v0.5.0-rc2 - validated Quality preset
; Target: 2560x1080 validation system, DX11 MT, OptiScaler -> DLSS.
; RC2 disables Action23 hashed coverage after bright clear-weather testing.

[OptiBridge]
Enabled=1
Jitter=1
RenderScale=0.85
NativeSceneScale=1
ProjectionJitter=1

; Validated temporal compromise. Do not change during RC regression testing.
JitterScale=0.35
DispatchJitterScale=1.0
MotionVectorScaleFactor=1.0
MVJitterCancellation=1

; Validated flora temporal inputs.
FloraReactiveMask=1
FloraReactiveStrength=0.50
FloraReactiveRadius=1

; Validated tree alpha stabilization.
FloraAlphaStabilization=1
FloraAlphaWidthScale=0.10

; Action23 remains compiled into the test executable but is disabled for RC2.
; Bright clear-weather testing showed more high-contrast leaf/twig flicker when enabled.
FloraHashedCoverage=0
FloraHashedCoverageScale=0.05
